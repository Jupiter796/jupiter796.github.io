name: Deploy Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# GitHub Pages 部署所需的最小权限
permissions:
  contents: read
  pages: write
  id-token: write

# 注意：必须是 false。
# 设成 true 会在连续推送时取消正在进行的 deploy job，而被取消的部署会在 Pages
# 侧留下一条永远 in-progress 的记录，之后每次部署都被它挡住（actions/deploy-pages#22）。
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Setup Pages
        uses: actions/configure-pages@v5

      # 依赖 package-lock.json，所以 lockfile 必须提交进仓库
      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # 纯静态托管没有服务端路由，用 404.html 给深链接兜底
      - name: Add 404 fallback
        run: cp dist/index.html dist/404.html

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
