<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice" role="img" aria-label="示例封面图">
  <defs>
    <linearGradient id="bg" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#0f1a2e"/>
      <stop offset="0.6" stop-color="#1d4ed8"/>
      <stop offset="1" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="pulse" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#e0f2fe" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#38bdf8" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>

  <g stroke="#93c5fd" stroke-opacity="0.28" stroke-width="2">
    <path d="M0 640 H1600 M0 700 H1600 M0 760 H1600"/>
  </g>

  <g fill="#93c5fd" fill-opacity="0.35">
    <rect x="180" y="560" width="86" height="90" rx="10"/>
    <rect x="300" y="600" width="86" height="50" rx="10"/>
    <rect x="420" y="520" width="86" height="130" rx="10"/>
    <rect x="540" y="580" width="86" height="70" rx="10"/>
    <rect x="660" y="470" width="86" height="180" rx="10"/>
    <rect x="780" y="545" width="86" height="105" rx="10"/>
    <rect x="900" y="420" width="86" height="230" rx="10"/>
    <rect x="1020" y="500" width="86" height="150" rx="10"/>
    <rect x="1140" y="360" width="86" height="290" rx="10"/>
    <rect x="1260" y="455" width="86" height="195" rx="10"/>
  </g>

  <rect x="120" y="300" width="1360" height="6" rx="3" fill="url(#pulse)"/>

  <g fill="none" stroke="#e0f2fe" stroke-opacity="0.7" stroke-width="4" stroke-linecap="round">
    <path d="M120 240 h150 l40 -70 l56 140 l46 -100 l40 30 h150"/>
  </g>
</svg>
