<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice" role="img" aria-label="示例封面图">
  <defs>
    <linearGradient id="bg" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#1a1b26"/>
      <stop offset="0.55" stop-color="#475569"/>
      <stop offset="1" stop-color="#94a3b8"/>
    </linearGradient>
    <linearGradient id="band" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f8fafc" stop-opacity="0.06"/>
      <stop offset="0.5" stop-color="#f8fafc" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#f8fafc" stop-opacity="0.06"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>

  <g fill="none" stroke="#e2e8f0" stroke-opacity="0.34" stroke-width="3">
    <path d="M140 620 C 380 620, 400 300, 640 300 S 900 620, 1140 620 S 1380 320, 1500 320"/>
  </g>

  <g fill="#e2e8f0" fill-opacity="0.18">
    <circle cx="640" cy="300" r="120"/>
  </g>

  <rect x="80" y="430" width="1440" height="8" rx="4" fill="url(#band)"/>

  <g fill="#f8fafc" fill-opacity="0.9">
    <circle cx="640" cy="300" r="14"/>
    <circle cx="1140" cy="620" r="14"/>
  </g>
</svg>
