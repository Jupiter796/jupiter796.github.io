    <path d="M300 520 C 460 520, 470 240, 640 240 S 820 520, 980 520" stroke-opacity="0.24"/>
  </g>

  <g fill="none" stroke="#ffffff" stroke-opacity="0.35" stroke-width="2" stroke-linecap="round">
    <path d="M1120 700 L1120 300 M1120 380 L1250 320 M1120 470 L1250 410 M1120 560 L1250 500"/>
  </g>

  <g fill="#ffffff" fill-opacity="0.9">
    <circle cx="300" cy="700" r="11"/>
    <circle cx="980" cy="700" r="11"/>
  </g>
</svg>
